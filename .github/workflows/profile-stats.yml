name: Refresh GitHub stats

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/profile_stats.py'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Render public account stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_stats.py
      - name: Publish the stats SVG
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
